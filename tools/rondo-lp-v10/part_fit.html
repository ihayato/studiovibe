<section data-sec="fit" style="padding-top:0">
    <div class="wrap">
      <h2 style="text-align:center;margin-bottom:16px">正直に言うと、万人向けではありません。</h2>
      <p class="lede" style="text-align:center;margin:0 auto 40px">サポート窓口はありません。<br>自信がない人は、買わないでください。</p>
      <div class="fit">
        <div class="fit-col yes">
          <h3>Rondoが向いている人</h3>
          <ul>
            <li>CodexやClaude Codeを日常的に使いこなしている人</li>
            <li>発信で商売をしている個人・小さなチーム</li>
            <li>SaaSの月額と仕様に縛られたくない人</li>
          </ul>
        </div>
        <div class="fit-col no">
          <h3>向いていない人</h3>
          <ul>
            <li>ノーコードで完結したい人</li>
            <li>完成品のアプリを期待する人</li>
            <li>開発AIを使う予定がない人</li>
            <li>独自ドメインを持っていない人</li>
            <li>サポート窓口が必要な人</li>
          </ul>
        </div>
      </div>

      <p class="sh-lede" id="shindan">では、あなたはどちらでしょう。<br>6問・約30秒で判定できます。</p>
      <div class="shindan">
        <div id="sh-quiz">
          <div class="sh-top">
            <span class="sh-step" id="sh-step">1 / 7</span>
            <span class="sh-dots" id="sh-dots" aria-hidden="true"></span>
            <button type="button" class="sh-back" id="sh-back" data-rondo-label="診断 前の質問" style="visibility:hidden">← 前の質問へ</button>
          </div>
          <div aria-live="polite">
            <p class="sh-q" id="sh-q"></p>
            <div class="sh-choices" id="sh-choices"></div>
          </div>
        </div>
        <div id="sh-result" class="sh-verdict" aria-live="polite" hidden></div>
      </div>
    </div>
  </section>
