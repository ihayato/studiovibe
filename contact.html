<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Studio VIBE</title>
    <meta name="description" content="Studio VIBEへのお問い合わせ。制作のご依頼、講演、採用、その他のご相談はこちらから。" />
    <!-- OGP -->
    <meta property="og:title" content="Contact | Studio VIBE" />
    <meta property="og:description" content="Studio VIBEへのお問い合わせ。制作のご依頼、講演、採用、その他のご相談はこちらから。" />
    <meta property="og:image" content="https://vibe.co.jp/img/og.png" />
    <meta property="og:url" content="https://vibe.co.jp/contact.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Studio VIBE" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Contact | Studio VIBE" />
    <meta name="twitter:description" content="Studio VIBEへのお問い合わせ。制作のご依頼、講演、採用、その他のご相談はこちらから。" />
    <meta name="twitter:image" content="https://vibe.co.jp/img/og.png" />
    <link rel="icon" type="image/png" href="/img/favicon.png">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script type="module" src="/contact.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=Noto+Sans+JP:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        /* Studio VIBE Contact — 夜×プリズム */
        .contact-page {
            padding: 160px 20px 120px;
            position: relative;
            background:
                radial-gradient(1px 1px at 12% 18%, rgba(244, 242, 236, 0.55), transparent 60%),
                radial-gradient(1px 1px at 78% 12%, rgba(244, 242, 236, 0.4), transparent 60%),
                radial-gradient(1.5px 1.5px at 34% 62%, rgba(123, 224, 255, 0.5), transparent 60%),
                radial-gradient(1px 1px at 60% 78%, rgba(244, 242, 236, 0.35), transparent 60%),
                radial-gradient(1px 1px at 90% 55%, rgba(244, 242, 236, 0.45), transparent 60%),
                radial-gradient(1.5px 1.5px at 22% 88%, rgba(244, 143, 184, 0.35), transparent 60%),
                radial-gradient(1px 1px at 50% 30%, rgba(244, 242, 236, 0.3), transparent 60%),
                #0a0a12;
            background-repeat: no-repeat;
        }

        .contact-page .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .contact-page .contact-page-header {
            text-align: center;
            max-width: 560px;
            margin: 0 auto 48px;
        }

        .contact-page .contact-page-header h1 {
            font-family: 'Avenir Next', 'Futura', var(--font-main);
            font-weight: 700;
            font-size: 3rem;
            letter-spacing: 0.08em;
            color: #f4f2ec;
            margin-bottom: 16px;
        }

        .contact-page .contact-page-header p {
            font-family: var(--font-jp);
            font-size: 1rem;
            line-height: 1.9;
            color: rgba(244, 242, 236, 0.68);
        }

        .contact-page .contact-card {
            width: min(560px, 92vw);
            margin: 0 auto;
            background: #13111c;
            border-radius: 14px;
            border: 1px solid rgba(217, 179, 106, 0.35);
            box-shadow: 0 0 0 1px rgba(123, 224, 255, 0.10), 0 30px 80px rgba(0, 0, 0, 0.5);
            padding: 48px 44px;
        }

        .contact-page .form-group {
            margin-bottom: 22px;
        }

        .contact-page .form-group label {
            display: block;
            margin-bottom: 10px;
            font-family: 'Avenir Next', 'Futura', var(--font-main);
            font-size: 11px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(123, 224, 255, 0.75);
        }

        .contact-page .form-group input,
        .contact-page .form-group select,
        .contact-page .form-group textarea {
            width: 100%;
            padding: 13px 14px;
            background: #0d0b14;
            border: 1px solid rgba(244, 242, 236, 0.18);
            border-radius: 8px;
            color: #f4f2ec;
            font-family: var(--font-jp);
            font-size: 0.95rem;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .contact-page .form-group textarea {
            resize: vertical;
            min-height: 140px;
        }

        .contact-page .form-group input::placeholder,
        .contact-page .form-group textarea::placeholder {
            color: rgba(244, 242, 236, 0.32);
        }

        .contact-page .form-group input:focus,
        .contact-page .form-group select:focus,
        .contact-page .form-group textarea:focus {
            outline: none;
            border-color: #7be0ff;
            box-shadow: 0 0 0 3px rgba(123, 224, 255, 0.18);
        }

        .contact-page .form-group select {
            appearance: none;
            background-image: linear-gradient(45deg, transparent 50%, rgba(123, 224, 255, 0.7) 50%),
                linear-gradient(135deg, rgba(123, 224, 255, 0.7) 50%, transparent 50%);
            background-position: calc(100% - 20px) center, calc(100% - 14px) center;
            background-size: 6px 6px, 6px 6px;
            background-repeat: no-repeat;
        }

        .contact-page .turnstile-container {
            display: flex;
            justify-content: center;
            margin-bottom: 22px;
        }

        .contact-page .btn-submit {
            width: 100%;
            padding: 16px;
            border-radius: 999px;
            font-family: 'Avenir Next', 'Futura', var(--font-main);
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.06em;
            color: #f4f2ec;
            background: #0d0b14;
            border: 1px solid transparent;
            background-image: linear-gradient(#0d0b14, #0d0b14), linear-gradient(90deg, #f48fb8, #7be0ff);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            cursor: pointer;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        .contact-page .btn-submit:hover:not(:disabled) {
            background-image: linear-gradient(rgba(123, 224, 255, 0.08), rgba(244, 143, 184, 0.08)), linear-gradient(90deg, #f48fb8, #7be0ff);
            box-shadow: 0 0 24px rgba(123, 224, 255, 0.18);
        }

        .contact-page .btn-submit:focus-visible {
            outline: 2px solid #7be0ff;
            outline-offset: 3px;
        }

        .contact-page .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .contact-page .form-message {
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 22px;
            display: none;
            font-family: var(--font-jp);
            font-size: 0.9rem;
        }

        .contact-page .form-message.success {
            display: block;
            background: rgba(123, 224, 255, 0.10);
            color: #7be0ff;
            border: 1px solid rgba(123, 224, 255, 0.3);
        }

        .contact-page .form-message.error {
            display: block;
            background: rgba(244, 143, 184, 0.12);
            color: #f48fb8;
            border: 1px solid rgba(244, 143, 184, 0.3);
        }

        a:focus-visible,
        button:focus-visible {
            outline: 2px solid #7be0ff;
            outline-offset: 3px;
        }

        @media (max-width: 600px) {
            .contact-page {
                padding: 130px 16px 80px;
            }

            .contact-page .contact-page-header h1 {
                font-size: 2.2rem;
            }

            .contact-page .contact-card {
                padding: 34px 24px;
            }
        }
    </style>
</head>

<body>
    <header id="header">
        <div class="container">
            <a href="/" class="logo">Studio VIBE</a>
            <nav>
                <ul>
                    <li><a href="/#philosophy">Philosophy</a></li>
                    <li><a href="/#works">Works</a></li>
                    <li><a href="/#business">Business</a></li>
                    <li><a href="/#team">Team</a></li>
                    <li><a href="/about.html">Company</a></li>
                    <li><a href="/blog.html">Blog</a></li>
                    <li><a href="/contact.html" class="btn-primary">Contact</a></li>
                </ul>
            </nav>
            <button id="lang-toggle" class="lang-toggle" aria-label="Toggle language">EN</button>
            <button class="mobile-menu-toggle" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <main>
        <section class="contact-page">
            <div class="container">
                <div class="contact-page-header">
                    <h1>Contact</h1>
                    <p>制作のご依頼、講演、採用、その他のご相談はこちらから。</p>
                </div>
                <div class="contact-card">
                    <form class="contact-form">
                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="type">Inquiry Type</label>
                            <select id="type" name="type">
                                <option value="production">制作依頼</option>
                                <option value="speaking">講演依頼</option>
                                <option value="recruitment">採用について</option>
                                <option value="other">その他</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea id="message" name="message" rows="5" required></textarea>
                        </div>
                        <div class="form-group turnstile-container">
                            <div class="cf-turnstile" data-sitekey="0x4AAAAAACaXaMN9Bai0y96b" data-theme="dark"></div>
                        </div>
                        <div id="form-message" class="form-message"></div>
                        <button type="submit" class="btn-submit">送信する</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <div class="footer-logo">Studio VIBE</div>
            <p>&copy; 2026 Studio VIBE. All rights reserved. ／ <a href="/licenses">Licenses</a></p>
        </div>
    </footer>
</body>

</html>
