<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0910">
  <title>月蝕綺譚島 | Studio VIBE Worlds</title>
  <meta name="description" content="喰われた月の下、御霊札を集めて『月蝕の間合い』に挑む、月蝕綺譚の体験島。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/world-shell.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <div class="eclipse-loader" aria-hidden="true">
      <span class="eclipse-loader__moon"></span>
      <span class="eclipse-loader__shadow"></span>
      <i></i><i></i><i></i>
    </div>
    <div class="loading-copy">
      <span>LUNA OCCULTA</span>
      <strong>月蝕綺譚島</strong>
      <small>今宵の境をひらいています</small>
    </div>
  </div>

  <header class="world-hud" aria-label="ワールド情報">
    <div class="world-mark">
      <span class="world-mark__en">LUNA OCCULTA</span>
      <strong>月蝕綺譚島</strong>
      <span id="presence">いま社に ひとり</span>
    </div>
    <div class="world-counter" aria-label="集めた御霊札">
      <span class="world-counter__glyph" aria-hidden="true">月</span>
      <span>御霊札</span><strong id="seal-count">0</strong><span>/3</span>
    </div>
  </header>

  <div id="objective">三枚の御霊札を探す</div>
  <button id="hint" type="button" aria-label="近くのものに触れる"></button>
  <div id="toast" role="status" aria-live="polite"></div>

  <div id="touch-controls" aria-hidden="true">
    <div id="joystick"><span></span></div>
  </div>
  <div class="world-controls" aria-label="ワールド操作">
    <button id="sound" class="round-control sound-control is-off" type="button" aria-label="BGMを再生" aria-pressed="false" title="BGMを再生">
      <span class="sound-control__bars" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="round-control__label">BGM</span>
    </button>
    <button id="jump" class="round-control jump-control" type="button" aria-label="ジャンプ">
      <span class="round-control__glyph" aria-hidden="true">↑</span>
      <span class="round-control__label">JUMP</span>
    </button>
  </div>

  <div id="shiori-panel" class="world-modal" data-world-modal hidden>
    <section class="world-sheet shiori-sheet" role="dialog" aria-modal="true" aria-labelledby="shiori-title">
      <button class="world-sheet__close" type="button" aria-label="栞との会話を閉じる">×</button>
      <img src="/worlds/luna/shiori_smile.webp" alt="案内役の御霊、栞">
      <div>
        <span class="world-sheet__kicker">GUIDE OF THE NIGHT</span>
        <h1 id="shiori-title">道しるべの御霊、栞</h1>
        <p>月蝕は、こちらとあちらの境がほどける夜。散らばった三枚の御霊札を見つけたら、奥の社へ。あるじどのの「間合い」を、そなたにも見せよう。</p>
        <p class="shiori-quote">「第一夜、と。では参ろうか、あるじどの」</p>
        <div class="world-actions">
          <button class="is-primary" type="button" data-close>夜道へ進む</button>
          <a href="https://vibe.co.jp/luna-occulta" target="_blank" rel="noopener noreferrer">公式サイトを見る</a>
        </div>
      </div>
    </section>
  </div>

  <div id="maai-panel" class="world-modal" data-world-modal hidden>
    <section class="world-sheet maai-sheet" role="dialog" aria-modal="true" aria-labelledby="maai-title">
      <button class="world-sheet__close" type="button" aria-label="間合いを閉じる">×</button>
      <span class="world-sheet__kicker">MOON ECLIPSE MAAI</span>
      <h1 id="maai-title">月蝕の間合い</h1>
      <p id="maai-copy">鬼を黄金の間合いまで引きつけ、三度の好機を斬り結ぶ。</p>
      <div class="maai-game" aria-label="間合いゲーム">
        <div class="maai-scene">
          <img id="maai-sakuya" src="/worlds/luna/maai_sakuya_kamae.webp" alt="刀を構える咲耶">
          <div class="maai-stats"><span id="maai-round">一 / 三</span><strong id="maai-score">0</strong></div>
        </div>
        <div id="maai-track" class="maai-track" aria-hidden="true">
          <span id="maai-zone" class="maai-zone"></span>
          <span id="maai-marker" class="maai-marker"></span>
        </div>
        <div id="maai-result" class="maai-result" role="status" aria-live="polite">黄金の間を見定める</div>
        <button id="maai-action" class="maai-action" type="button">始める</button>
      </div>
      <div id="maai-links" class="world-actions" hidden>
        <button id="maai-retry" type="button">もう一度</button>
        <a class="is-primary" href="https://vibe.co.jp/luna-occulta" target="_blank" rel="noopener noreferrer">綺譚の続きを見る</a>
      </div>
    </section>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
