<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rondo ロゴ案</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@800&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box} body{margin:0;font-family:'Zen Kaku Gothic New',sans-serif;background:#F5F3EC;color:#28263C}
  .row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;max-width:1100px;margin:0 auto;padding:24px 16px}
  @media (max-width:820px){.row{grid-template-columns:1fr}}
  .opt{border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(40,38,60,.12),0 2px 8px rgba(40,38,60,.08)}
  .opt h2{margin:0;padding:14px 18px;font-size:15px;background:#FBF9F5}
  .opt p{margin:0;padding:0 18px 14px;font-size:13px;color:#6F6B86;background:#FBF9F5;line-height:1.7}
  .pane{display:flex;align-items:center;gap:14px;padding:26px 22px}
  .pane.light{background:#F5F3EC}.pane.dark{background:#131320}
  .pane svg{width:56px;height:56px;flex:none}
  .wm{font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:30px;letter-spacing:.03em}
  .light .wm{color:#28263C}.dark .wm{color:#E8E4D8}
  .small{display:flex;gap:10px;align-items:center;margin-left:auto}
  .small svg{width:24px;height:24px}
  h1{max-width:1100px;margin:28px auto 0;padding:0 16px;font-family:'Shippori Mincho B1',serif;font-size:24px}
</style>
</head>
<body>
<h1>Rondo ロゴ案（羽二重）</h1>
<div class="row">
  <section class="opt">
    <h2>A 輪と金の点（いま管理画面に入れた案）</h2>
    <div class="pane light"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#1F1C2E"/><circle cx="16" cy="16" r="8.6" fill="none" stroke="#ECE8DC" stroke-width="1.6"/><circle cx="22.1" cy="9.9" r="2.6" fill="#D9A94C"/></svg><span class="wm">Rondo</span><span class="small"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#1F1C2E"/><circle cx="16" cy="16" r="8.6" fill="none" stroke="#ECE8DC" stroke-width="2"/><circle cx="22.1" cy="9.9" r="3" fill="#D9A94C"/></svg></span></div>
    <div class="pane dark"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#1F1C2E"/><circle cx="16" cy="16" r="8.6" fill="none" stroke="#ECE8DC" stroke-width="1.6"/><circle cx="22.1" cy="9.9" r="2.6" fill="#D9A94C"/></svg><span class="wm">Rondo</span></div>
    <p>Rondo＝輪舞。輪をひとめぐりする金の点。LPの「糸が1本になる」図とも同じ言葉。</p>
  </section>
  <section class="opt">
    <h2>B 明朝のR</h2>
    <div class="pane light"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#1F1C2E"/><text x="15" y="23.5" text-anchor="middle" font-family="Shippori Mincho B1, serif" font-weight="800" font-size="20" fill="#ECE8DC">R</text><circle cx="24.4" cy="8" r="2.4" fill="#D9A94C"/></svg><span class="wm">Rondo</span><span class="small"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#1F1C2E"/><text x="15" y="23.5" text-anchor="middle" font-family="Shippori Mincho B1, serif" font-weight="800" font-size="20" fill="#ECE8DC">R</text><circle cx="24.4" cy="8" r="2.6" fill="#D9A94C"/></svg></span></div>
    <div class="pane dark"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#1F1C2E"/><text x="15" y="23.5" text-anchor="middle" font-family="Shippori Mincho B1, serif" font-weight="800" font-size="20" fill="#ECE8DC">R</text><circle cx="24.4" cy="8" r="2.4" fill="#D9A94C"/></svg><span class="wm">Rondo</span></div>
    <p>いまのロゴ（明朝のR＋右上の点）を羽二重の色に。変化が一番小さい。</p>
  </section>
  <section class="opt">
    <h2>C 欠けた輪</h2>
    <div class="pane light"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#1F1C2E"/><path d="M 22.6 10.6 A 8.6 8.6 0 1 1 18.6 7.8" fill="none" stroke="#ECE8DC" stroke-width="1.8" stroke-linecap="round"/><circle cx="21.3" cy="9.1" r="1.9" fill="#D9A94C"/></svg><span class="wm">Rondo</span><span class="small"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#1F1C2E"/><path d="M 22.6 10.6 A 8.6 8.6 0 1 1 18.6 7.8" fill="none" stroke="#ECE8DC" stroke-width="2.2" stroke-linecap="round"/><circle cx="21.3" cy="9.1" r="2.3" fill="#D9A94C"/></svg></span></div>
    <div class="pane dark"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#1F1C2E"/><path d="M 22.6 10.6 A 8.6 8.6 0 1 1 18.6 7.8" fill="none" stroke="#ECE8DC" stroke-width="1.8" stroke-linecap="round"/><circle cx="21.3" cy="9.1" r="1.9" fill="#D9A94C"/></svg><span class="wm">Rondo</span></div>
    <p>輪の切れ目に金の点。回り続ける動きと、つながる一点を表す。</p>
  </section>
</div>
</body>
</html>
